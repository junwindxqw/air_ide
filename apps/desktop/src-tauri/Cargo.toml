[package]
name = "air-ide"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
notify = "7"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
ignore = "0.4"
air-core = { path = "../../../crates/air-core" }
air-fs = { path = "../../../crates/air-fs" }
air-git = { path = "../../../crates/air-git" }
air-lsp = { path = "../../../crates/air-lsp" }
air-search = { path = "../../../crates/air-search" }
air-win = { path = "../../../crates/air-win" }
air-workspace = { path = "../../../crates/air-workspace" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
