name: CI

# 触发：向 main 的 push、面向 main 的 PR、手动触发。
# 只做静态检查/单元测试/前端产物，不产出安装包（安装包走 release 流程）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows / check + test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 对齐本项目开发/脚本基线 Node 22；pnpm 对齐本机 11.22.0。
      # 仓库当前没有 packageManager/engines 字段，见 docs/TESTING.md「遗留风险」。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript / ESLint / Vitest
        run: pnpm --filter desktop check

      # 发版脚本的资产名规则（空格→点）必须与 GitHub 实际资产名一致，防止清单 URL 404。
      - name: Release script unit tests
        run: pnpm test:release

      - name: Rust tests
        run: cargo test --workspace

      # 严格门槛：clippy 告警即失败。
      # fmt 未纳入门禁：仓库尚未统一 rustfmt（当前 23/28 个 .rs 文件不符合默认格式），
      # 格式化将作为单独提交后续引入，避免纯格式噪声 diff 混入功能审阅。
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build frontend
        run: pnpm --filter desktop exec vite build
